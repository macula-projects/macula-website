services:

  site:
    image: macula-website:local
    build:
      context: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["npm ci && npm run dev -- --bind 0.0.0.0 --port 1313"]
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - .:/project
      - site_node_modules:/project/node_modules

volumes:
  site_node_modules:
