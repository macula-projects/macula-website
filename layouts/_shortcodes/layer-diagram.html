{{ $name := .Get "name" }}
<figure>
  <a href="{{ .Get "original" }}" data-fancybox="layer-original"><img src="{{ .Get "original" }}" alt="{{ .Get "title" }}原始图" loading="lazy"></a>
</figure>
<details>
  <summary>补充示意图</summary>
  <a href="{{ printf "/diagrams/%s.svg" $name | relURL }}" data-fancybox="layer-supplement"><img src="{{ printf "/diagrams/%s.svg" $name | relURL }}" alt="{{ .Get "title" }}补充示意图" loading="lazy"></a>
</details>
