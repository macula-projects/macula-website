{{ with resources.Get "diagrams/security-architecture.svg" }}

  <div class="security-architecture-scroll" tabindex="0" role="region" aria-label="安全架构原理图，窄屏可横向滚动">
    {{ .Content | safeHTML }}
  </div>
  <figcaption>网关处理入口认证与访问规则，微服务继续校验 JWT 和业务权限。窄屏可横向滚动，或<a href="{{ .RelPermalink }}">单独打开原理图</a>查看。</figcaption>
</figure>
{{ end }}
