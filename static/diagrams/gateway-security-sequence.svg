<svg xmlns="http://www.w3.org/2000/svg" width="900" height="922" viewBox="0 0 900 922" role="img" aria-labelledby="title desc"><title id="title">网关：入口校验到响应保护</title><desc id="desc">这是职责时序；过滤器排序以本页全景图及源码为准。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="900" height="922" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="22" y="32" font-size="19" font-weight="600" text-anchor="start">网关：入口校验到响应保护</text>
<text x="22" y="61" font-size="14" font-weight="400" text-anchor="start">按编号阅读；虚线箭头表示返回，浅色框表示条件或执行阶段。</text>
<path d="M123.0 124V857" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="17.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="123.0" y="110" font-size="14" font-weight="600" text-anchor="middle">调用方</text>
<path d="M341.0 124V857" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="235.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="341.0" y="110" font-size="14" font-weight="600" text-anchor="middle">外层 WebFilter</text>
<path d="M559.0 124V857" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="453.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="559.0" y="110" font-size="14" font-weight="600" text-anchor="middle">网关路由过滤链</text>
<path d="M777.0 124V857" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="671.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="777.0" y="110" font-size="14" font-weight="600" text-anchor="middle">下游服务</text>
<path d="M123.0 183H341.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="232.0" y="150" font-size="14" font-weight="400" text-anchor="middle">1. 提交业务请求与外部凭据</text>
<rect x="28" y="208" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="229" font-size="14" font-weight="400" text-anchor="start">2. 本地端点可直接返回；业务路由继续外层安全校验</text>
<rect x="239.0" y="274" width="204.0" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="248.0" y="292" font-size="14" font-weight="400" text-anchor="start">3. 认证与入口权限</text>
<path d="M341.0 393H559.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="360" font-size="14" font-weight="400" text-anchor="middle">4. 匹配路由，进入过滤链</text>
<rect x="457.0" y="414" width="204.0" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="466.0" y="432" font-size="14" font-weight="400" text-anchor="start">5. 按需校验签名、解密</text>
<rect x="28" y="488" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="509" font-size="14" font-weight="400" text-anchor="start">6. HMAC 在 Kong 过滤器实际验签；失败即拒绝，不进入下游</text>
<rect x="457.0" y="554" width="204.0" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="466.0" y="572" font-size="14" font-weight="400" text-anchor="start">7. 可信身份转换为 JWT</text>
<path d="M559.0 673H777.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="668.0" y="640" font-size="14" font-weight="400" text-anchor="middle">8. 转发请求</text>
<path d="M777.0 743H559.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="668.0" y="710" font-size="14" font-weight="400" text-anchor="middle">9. 返回业务结果</text>
<path d="M559.0 813H123.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="341.0" y="780" font-size="14" font-weight="400" text-anchor="middle">10. 按需加密响应，返回调用方</text>
<text x="22" y="890" font-size="14" font-weight="400" text-anchor="start">这是职责时序；过滤器排序以本页全景图及源码为准。</text>
</g></svg>