<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">跨服务：契约与转换边界</title><desc id="desc">平台 A 的服务 a 调用服务 b，再调用平台 B 的服务 c。请求 Query 与响应 VO 按各服务的稳定 API 契约转换；语义相同的契约可以复用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="100%" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#172839"><text x="24" y="32" font-weight="600">跨服务：契约与转换边界</text><rect x="24" y="70" width="170" height="65" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="109.0" y="95" text-anchor="middle">平台 A · 服务 a</text><text x="109.0" y="117" text-anchor="middle">页面 / 业务入口</text><rect x="295" y="70" width="170" height="65" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="380.0" y="95" text-anchor="middle">平台 A · 服务 b</text><text x="380.0" y="117" text-anchor="middle">聚合 / 领域服务</text><rect x="566" y="70" width="170" height="65" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="651.0" y="95" text-anchor="middle">平台 B · 服务 c</text><text x="651.0" y="117" text-anchor="middle">被调用方</text><path d="M24 188H194" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="109.0" y="179.0" text-anchor="middle">aQuery</text><path d="M194 188H465" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="329.5" y="179.0" text-anchor="middle">转换为 bQuery →</text><path d="M465 188H736" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="600.5" y="179.0" text-anchor="middle">转换为 cQuery →</text><path d="M736 252H465" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="600.5" y="243.0" text-anchor="middle">cVO → bVO</text><path d="M465 252H194" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="329.5" y="243.0" text-anchor="middle">bVO → aVO</text><path d="M194 252H24" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="109.0" y="243.0" text-anchor="middle">返回</text><text x="24" y="315">调用方依赖被调用方的 *-api，使用 Query / Form / VO 等稳定契约。</text><text x="24" y="347">调用方适配层负责转换与组合，不引用远端 Entity、Mapper 或实现。</text><text x="24" y="379">同一语义可复用契约，不要求每经过一层都复制模型或全部命名为 DTO。</text></g></svg>