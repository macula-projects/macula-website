<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1600" viewBox="0 0 1120 1600" role="img" aria-labelledby="gw-title gw-desc"><title id="gw-title">Macula Gateway 请求处理与过滤器全景</title><desc id="gw-desc">请求先经 WebFilter 的本地端点或 API Key 认证，再进入 Spring Security 的 Token 认证与入口授权；路由匹配后进入按 order 合并排序的 GlobalFilter 与路由 GatewayFilter 链。图中列出灰度、Body 缓存、接口签名、加解密、HMAC、内部 JWT，再由框架完成负载均衡与 HTTP 或 WebSocket 转发。响应由装饰器按需加密，并在有效链路上下文中添加 Trace ID。</desc><defs><marker id="gw-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3974ae"/></marker></defs><rect width="1120" height="1600" rx="18" fill="#fff"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#273f57">
<text x="28" y="40" font-size="28" font-weight="650" fill="#273f57">Gateway：请求 → 过滤链 → 下游 → 响应</text>
<text x="28" y="71" font-size="19" font-weight="400" fill="#52677d">两层过滤链分别排序；MIN = Integer.MIN_VALUE，MAX = Integer.MAX_VALUE</text>
<rect x="24" y="94" width="1072" height="272" rx="11" fill="#f2f7fd" stroke="#bfd2e6"/>
<text x="44" y="129" font-size="23" font-weight="650" fill="#273f57">① WebFlux 外层 WebFilter：先处理本地端点，再识别 API Key</text>
<rect x="44" y="148" width="332" height="93" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="56" y="175" font-size="17" font-weight="650" fill="#273f57">NimbusJwkSetEndpointFilter</text>
<text x="56" y="203" font-size="18" font-weight="400" fill="#1465b5">MIN + 100</text>
<text x="56" y="227" font-size="17" font-weight="400" fill="#273f57">公钥集 /oauth2/jwks</text>
<rect x="400" y="148" width="332" height="93" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="412" y="175" font-size="17" font-weight="650" fill="#273f57">RmOpaqueTokenEndpointFilter</text>
<text x="412" y="203" font-size="18" font-weight="400" fill="#1465b5">MIN + 200</text>
<text x="412" y="227" font-size="17" font-weight="400" fill="#273f57">移除缓存；按自身规则校验 HMAC</text>
<rect x="756" y="148" width="332" height="93" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="768" y="175" font-size="17" font-weight="650" fill="#273f57">ProtectUrlsEndpointFilter</text>
<text x="768" y="203" font-size="18" font-weight="400" fill="#1465b5">MIN + 300</text>
<text x="768" y="227" font-size="17" font-weight="400" fill="#273f57">保护路径清单 / SM2 公钥</text>
<text x="44" y="267" font-size="19" font-weight="400" fill="#52677d">上述端点匹配即就地响应，不进入后面的路由过滤链。</text>
<rect x="44" y="282" width="1032" height="61" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="307" font-size="20" font-weight="650" fill="#273f57">ApiKeyAuthenticationFilter · MIN + 400</text>
<text x="60" y="332" font-size="18" font-weight="400" fill="#273f57">识别 Bearer sk-… → System Redis → 建立应用身份上下文，移除原 Authorization</text>
<path d="M560 366V392" stroke="#3974ae" stroke-width="2" marker-end="url(#gw-arrow)"/>
<rect x="24" y="396" width="1072" height="181" rx="11" fill="#f2f7fd" stroke="#bfd2e6"/>
<text x="44" y="432" font-size="22" font-weight="650" fill="#273f57">② Spring Security：SecurityWebFilterChain + ResourceServerAuthorizationManager</text>
<rect x="44" y="450" width="332" height="104" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="58" y="480" font-size="21" font-weight="650" fill="#273f57">Token</text>
<text x="58" y="510" font-size="18" font-weight="400" fill="#273f57">IAM introspection / 认证缓存</text>
<text x="58" y="536" font-size="18" font-weight="400" fill="#273f57">角色与菜单 / URL 规则</text>
<rect x="400" y="450" width="332" height="104" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="414" y="480" font-size="21" font-weight="650" fill="#273f57">HMAC</text>
<text x="414" y="510" font-size="18" font-weight="400" fill="#273f57">入口授权先交给后续链</text>
<text x="414" y="536" font-size="18" font-weight="400" fill="#273f57">KongApiGlobalFilter 才做验签</text>
<rect x="756" y="450" width="332" height="104" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="770" y="480" font-size="21" font-weight="650" fill="#273f57">API Key</text>
<text x="770" y="510" font-size="18" font-weight="400" fill="#273f57">复用前面已建立的上下文</text>
<text x="770" y="536" font-size="18" font-weight="400" fill="#273f57">按应用身份进入系统调用分支</text>
<path d="M560 577V603" stroke="#3974ae" stroke-width="2" marker-end="url(#gw-arrow)"/>
<rect x="24" y="607" width="1072" height="68" rx="11" fill="#eef3f8" stroke="#bfd2e6"/>
<text x="44" y="636" font-size="23" font-weight="650" fill="#273f57">③ 匹配 Route → FilteringWebHandler</text>
<text x="44" y="662" font-size="19" font-weight="400" fill="#273f57">合并 GlobalFilter 与本条路由的 GatewayFilter；请求侧按 order 从小到大执行</text>
<path d="M560 675V702" stroke="#3974ae" stroke-width="2" marker-end="url(#gw-arrow)"/>
<rect x="24" y="706" width="1072" height="600" rx="11" fill="#f1f8f4" stroke="#bfd2e6"/>
<text x="44" y="744" font-size="23" font-weight="650" fill="#273f57">④ 路由过滤链：下表为 Macula GlobalFilter 的相对请求顺序</text>
<rect x="44" y="761" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="792" font-size="19" font-weight="650" fill="#247455">MIN</text>
<text x="158" y="792" font-size="20" font-weight="650" fill="#273f57">GrayscalePublishGlobalFilter</text>
<text x="590" y="792" font-size="19" font-weight="400" fill="#273f57">接收并传递 grayversion 标签</text>
<rect x="44" y="819" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="850" font-size="19" font-weight="650" fill="#247455">-10</text>
<text x="158" y="850" font-size="20" font-weight="650" fill="#273f57">BodyGlobalFilter</text>
<text x="590" y="850" font-size="19" font-weight="400" fill="#273f57">按需缓存原始请求体，供后续读取</text>
<rect x="44" y="877" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="908" font-size="19" font-weight="650" fill="#247455">-8</text>
<text x="158" y="908" font-size="20" font-weight="650" fill="#273f57">SignCheckGlobalFilter</text>
<text x="590" y="908" font-size="19" font-weight="400" fill="#273f57">接口签名 / 时间戳 / nonce 校验</text>
<rect x="44" y="935" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="966" font-size="19" font-weight="650" fill="#247455">-5</text>
<text x="158" y="966" font-size="20" font-weight="650" fill="#273f57">CryptoGlobalFilter</text>
<text x="590" y="966" font-size="19" font-weight="400" fill="#273f57">解密请求，并安装响应加密装饰器</text>
<rect x="44" y="993" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="1024" font-size="19" font-weight="650" fill="#247455">200</text>
<text x="158" y="1024" font-size="20" font-weight="650" fill="#273f57">KongApiGlobalFilter</text>
<text x="590" y="1024" font-size="19" font-weight="400" fill="#273f57">HMAC 应用验签 / Date / 允许 URL</text>
<rect x="44" y="1051" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="1082" font-size="19" font-weight="650" fill="#247455">1000</text>
<text x="158" y="1082" font-size="20" font-weight="650" fill="#273f57">AddJwtGlobalFilter</text>
<text x="590" y="1082" font-size="19" font-weight="400" fill="#273f57">可信身份 → 内部 JWT → Authorization</text>
<rect x="44" y="1109" width="1032" height="49" rx="11" fill="#fff" stroke="#bfd2e6"/>
<text x="60" y="1140" font-size="19" font-weight="650" fill="#247455">MAX</text>
<text x="158" y="1140" font-size="20" font-weight="650" fill="#273f57">TraceIdGlobalFilter</text>
<text x="590" y="1140" font-size="19" font-weight="400" fill="#273f57">注册成功回调；有效 Span 时补 x-traceId</text>
<text x="44" y="1200" font-size="19" font-weight="400" fill="#52677d">框架与路由过滤器会穿插其中；不是只有上表这些过滤器。</text>
<text x="44" y="1231" font-size="19" font-weight="400" fill="#273f57">例如 StripPrefix / RewritePath、URL 构造、负载均衡、HTTP / WebSocket 路由。</text>
<text x="44" y="1270" font-size="19" font-weight="400" fill="#52677d">Trace 回调与响应加密发生在响应侧，不能把表中数字当成响应完成顺序。</text>
<path d="M560 1306V1331" stroke="#3974ae" stroke-width="2" marker-end="url(#gw-arrow)"/>
<rect x="24" y="1335" width="1072" height="78" rx="11" fill="#f2f7fd" stroke="#bfd2e6"/>
<text x="44" y="1367" font-size="23" font-weight="650" fill="#273f57">⑤ 下游 BFF / Service</text>
<text x="44" y="1395" font-size="20" font-weight="400" fill="#273f57">Security Starter 独立验证内部 JWT，再执行方法、资源及业务数据权限检查</text>
<path d="M560 1413V1439" stroke="#3974ae" stroke-width="2" marker-end="url(#gw-arrow)"/>
<rect x="24" y="1443" width="1072" height="129" rx="11" fill="#e8f1fc" stroke="#bfd2e6"/>
<text x="44" y="1478" font-size="23" font-weight="650" fill="#273f57">响应返回调用方</text>
<text x="44" y="1510" font-size="20" font-weight="400" fill="#273f57">框架写回响应；Crypto 装饰器按协议加密 Result.data，Trace 回调按条件补响应头。</text>
<text x="44" y="1545" font-size="19" font-weight="400" fill="#52677d">任一认证 / 授权 / 验签失败可提前终止；早期就地返回不保证经过全部 GlobalFilter。</text>
</g></svg>
