<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Macula 平台与业务应用架构</title>
<desc id="desc">Macula Cloud 提供 IAM 和 System。业务前端通过应用网关调用 BFF，BFF 调用业务服务，由业务服务访问数据库。应用网关验证 IAM 令牌，BFF 经 Cloud 网关访问 System。Macula Boot 为应用提供基础组件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3974ae" stroke-width="1.3"/></marker></defs>
<rect width="960" height="590" rx="14" fill="#fff"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#273f57">
<rect x="20" y="20" width="920" height="205" rx="12" fill="#f2f7fd" stroke="#bacfe5"/>
<text x="40" y="50" font-weight="650">Macula Cloud · 公共平台服务</text>
<rect x="55" y="83" width="215" height="75" rx="8" fill="#fff" stroke="#8db0d4"/>
<text x="162" y="112" text-anchor="middle" font-weight="650">IAM</text><text x="162" y="138" text-anchor="middle">统一登录与外部令牌</text>
<rect x="365" y="83" width="215" height="75" rx="8" fill="#fff" stroke="#8db0d4"/>
<text x="472" y="112" text-anchor="middle" font-weight="650">Cloud Gateway</text><text x="472" y="138" text-anchor="middle">平台服务访问入口</text>
<rect x="675" y="83" width="215" height="75" rx="8" fill="#fff" stroke="#8db0d4"/>
<text x="782" y="112" text-anchor="middle" font-weight="650">System</text><text x="782" y="138" text-anchor="middle">应用、用户、角色与菜单</text>
<path d="M580 120H671" fill="none" stroke="#3974ae" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="198">Cloud Admin 管理平台；ID、调度等服务按需部署。</text>
<rect x="20" y="295" width="920" height="190" rx="12" fill="#f8fafc" stroke="#bacfe5"/>
<text x="40" y="324" font-weight="650">业务应用 · 按职责组织自己的功能与数据</text>
<g fill="#fff" stroke="#8db0d4"><rect x="40" y="357" width="140" height="76" rx="8"/><rect x="225" y="357" width="140" height="76" rx="8"/><rect x="410" y="357" width="140" height="76" rx="8"/><rect x="595" y="357" width="140" height="76" rx="8"/><rect x="780" y="357" width="140" height="76" rx="8"/></g>
<g text-anchor="middle"><text x="110" y="386" font-weight="650">业务前端</text><text x="110" y="412">页面与交互</text><text x="295" y="386" font-weight="650">应用 Gateway</text><text x="295" y="412">路由与入口认证</text><text x="480" y="386" font-weight="650">BFF</text><text x="480" y="412">页面接口聚合</text><text x="665" y="386" font-weight="650">业务 Service</text><text x="665" y="412">规则与事务</text><text x="850" y="386" font-weight="650">业务数据库</text><text x="850" y="412">服务自有数据</text></g>
<g fill="none" stroke="#3974ae" stroke-width="1.5" marker-end="url(#arrow)"><path d="M180 394H220"/><path d="M365 394H405"/><path d="M550 394H590"/><path d="M735 394H775"/></g>
<g fill="none" stroke="#3974ae" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"><path d="M295 357V252H162V162"/><path d="M480 357V162"/></g>
<text x="40" y="274">Gateway → IAM：验证外部 Token</text><text x="501" y="274">BFF → Cloud：获取平台用户与菜单</text>
<text x="40" y="463">网关向下游传递内部 JWT；服务间通过 API 契约调用，BFF 与 Service 分别验签并授权。</text>
<rect x="20" y="515" width="920" height="55" rx="9" fill="#e7f1fc" stroke="#8db0d4"/>
<text x="480" y="549" text-anchor="middle">Macula Boot · 依赖管理、自动配置、Web、安全、数据访问、服务调用与可观测性</text>
</g></svg>
