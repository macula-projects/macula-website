<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="platform-title platform-desc">
<title id="platform-title">Macula 整体技术架构 · latest</title>
<desc id="platform-desc">沿用原图分层布局。上层为 Macula Cloud 公共平台及业务应用，中层为 Macula Boot 基础框架，右侧为按需接入的服务治理和可观测性，底层为基础设施。Cloud 包含 Gateway、IAM、System、TinyID、SnailJob、RocketMQ、Seata、Docs 及同仓 Admin。Boot 基于 Java 17、Spring Boot 4.0、Spring Cloud 2025.1，按需引入组件。</desc>
