<svg xmlns="http://www.w3.org/2000/svg" width="340" height="978" viewBox="0 0 340 978" role="img" aria-labelledby="title desc"><title id="title">可靠消息：本地事务与失败补偿（纵向阅读）</title><desc id="desc">图示以有事务场景为主；没有事务同步时会直接发送。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="340" height="978" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="16" y="29" font-size="18" font-weight="600" text-anchor="start">可靠消息：本地事务与失败补偿</text>
<text x="16" y="58" font-size="14" font-weight="400" text-anchor="start">沿编号阅读各参与方与执行步骤。</text>
<rect x="10" y="80" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="105" font-size="15" font-weight="600" text-anchor="start">1. 业务 / Sender → 本地数据库</text>
<text x="24" y="127" font-size="14" font-weight="400" text-anchor="start">同一本地事务写业务与消息</text>
<rect x="10" y="168" width="320" height="92" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="24" y="193" font-size="15" font-weight="600" text-anchor="start">2. 条件 / 阶段</text>
<text x="24" y="215" font-size="14" font-weight="400" text-anchor="start">本地事务失败：一起回滚；提交成功：触发后</text>
<text x="24" y="236" font-size="14" font-weight="400" text-anchor="start">续发送</text>
<rect x="10" y="277" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="302" font-size="15" font-weight="600" text-anchor="start">3. 业务 / Sender → 发送 / 补偿</text>
<text x="24" y="324" font-size="14" font-weight="400" text-anchor="start">提交后执行发送任务</text>
<rect x="10" y="365" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="390" font-size="15" font-weight="600" text-anchor="start">4. 发送 / 补偿 → RocketMQ / 消费端</text>
<text x="24" y="412" font-size="14" font-weight="400" text-anchor="start">发送消息</text>
<rect x="10" y="453" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="478" font-size="15" font-weight="600" text-anchor="start">5. 发送 / 补偿 → 本地数据库</text>
<text x="24" y="500" font-size="14" font-weight="400" text-anchor="start">记录发送结果</text>
<rect x="10" y="541" width="320" height="92" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="24" y="566" font-size="15" font-weight="600" text-anchor="start">6. 条件 / 阶段</text>
<text x="24" y="588" font-size="14" font-weight="400" text-anchor="start">未成功记录由实际调度的补偿任务扫描；补偿</text>
<text x="24" y="609" font-size="14" font-weight="400" text-anchor="start">任务需应用自行安排</text>
<rect x="10" y="650" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="675" font-size="15" font-weight="600" text-anchor="start">7. 发送 / 补偿 → 本地数据库</text>
<text x="24" y="697" font-size="14" font-weight="400" text-anchor="start">加载未成功消息</text>
<rect x="10" y="738" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="763" font-size="15" font-weight="600" text-anchor="start">8. 发送 / 补偿 → RocketMQ / 消费端</text>
<text x="24" y="785" font-size="14" font-weight="400" text-anchor="start">再次发送；可能重复</text>
<rect x="10" y="826" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="851" font-size="15" font-weight="600" text-anchor="start">9. RocketMQ / 消费端</text>
<text x="24" y="873" font-size="14" font-weight="400" text-anchor="start">按业务键幂等消费</text>
<text x="24" y="942" font-size="14" font-weight="400" text-anchor="start">图示以有事务场景为主；没有事务同步时会直</text>
<text x="24" y="963" font-size="14" font-weight="400" text-anchor="start">接发送。</text>
</g></svg>