<svg xmlns="http://www.w3.org/2000/svg" width="340" height="957" viewBox="0 0 340 957" role="img" aria-labelledby="title desc"><title id="title">Passkey：从授权列表到资源请求（纵向阅读）</title><desc id="desc">操作权限另用 @PreAuthorize；返回值归属另用 @PostAuthorize。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="340" height="957" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="16" y="29" font-size="18" font-weight="600" text-anchor="start">Passkey：从授权列表到资源请求</text>
<text x="16" y="58" font-size="14" font-weight="400" text-anchor="start">沿编号阅读各参与方与执行步骤。</text>
<rect x="10" y="80" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="105" font-size="15" font-weight="600" text-anchor="start">1. 前端 → Controller / Web</text>
<text x="24" y="127" font-size="14" font-weight="400" text-anchor="start">请求可访问资源列表</text>
<rect x="10" y="168" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="193" font-size="15" font-weight="600" text-anchor="start">2. Controller / Web → 业务 / 数据</text>
<text x="24" y="215" font-size="14" font-weight="400" text-anchor="start">业务先按身份和数据范围查询</text>
<rect x="10" y="256" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="281" font-size="15" font-weight="600" text-anchor="start">3. 业务 / 数据 → Controller / Web</text>
<text x="24" y="303" font-size="14" font-weight="400" text-anchor="start">返回 PasskeyResource 列表</text>
<rect x="10" y="344" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="369" font-size="15" font-weight="600" text-anchor="start">4. Controller / Web → Security</text>
<text x="24" y="391" font-size="14" font-weight="400" text-anchor="start">按当前身份签发列表凭证</text>
<rect x="10" y="432" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="457" font-size="15" font-weight="600" text-anchor="start">5. Controller / Web → 前端</text>
<text x="24" y="479" font-size="14" font-weight="400" text-anchor="start">返回资源 ID 与 passkey</text>
<rect x="10" y="520" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="545" font-size="15" font-weight="600" text-anchor="start">6. 前端 → Controller / Web</text>
<text x="24" y="567" font-size="14" font-weight="400" text-anchor="start">资源 ID + Header / Query 凭证</text>
<rect x="10" y="608" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="633" font-size="15" font-weight="600" text-anchor="start">7. Controller / Web → Security</text>
<text x="24" y="655" font-size="14" font-weight="400" text-anchor="start">绑定参数后校验 @Passkey</text>
<rect x="10" y="696" width="320" height="92" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="24" y="721" font-size="15" font-weight="600" text-anchor="start">8. 条件 / 阶段</text>
<text x="24" y="743" font-size="14" font-weight="400" text-anchor="start">身份、资源、签名或有效期不匹配：拒绝，</text>
<text x="24" y="764" font-size="14" font-weight="400" text-anchor="start">Controller 不执行</text>
<rect x="10" y="805" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="830" font-size="15" font-weight="600" text-anchor="start">9. Controller / Web → 业务 / 数据</text>
<text x="24" y="852" font-size="14" font-weight="400" text-anchor="start">校验通过，再执行业务方法</text>
<text x="24" y="921" font-size="14" font-weight="400" text-anchor="start">操作权限另用 @PreAuthorize；返回值归属另</text>
<text x="24" y="942" font-size="14" font-weight="400" text-anchor="start">用 @PostAuthorize。</text>
</g></svg>