<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1112" viewBox="0 0 340 1112" role="img" aria-labelledby="title desc"><title id="title">一次请求：职责与身份流转（纵向阅读）</title><desc id="desc">AK/SK、API Key 分别走应用认证路径；不自动获得用户角色。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="340" height="1112" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="16" y="29" font-size="18" font-weight="600" text-anchor="start">一次请求：职责与身份流转</text>
<text x="16" y="58" font-size="14" font-weight="400" text-anchor="start">沿编号阅读各参与方与执行步骤。</text>
<rect x="10" y="80" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="105" font-size="15" font-weight="600" text-anchor="start">1. 调用方 → 应用 Gateway</text>
<text x="24" y="127" font-size="14" font-weight="400" text-anchor="start">外部 Token / 应用凭据</text>
<rect x="10" y="168" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="193" font-size="15" font-weight="600" text-anchor="start">2. 应用 Gateway → IAM / 平台</text>
<text x="24" y="215" font-size="14" font-weight="400" text-anchor="start">Token 内省；应用凭据读取平台缓存</text>
<rect x="10" y="256" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="281" font-size="15" font-weight="600" text-anchor="start">3. IAM / 平台 → 应用 Gateway</text>
<text x="24" y="303" font-size="14" font-weight="400" text-anchor="start">可信身份与访问规则</text>
<rect x="10" y="344" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="369" font-size="15" font-weight="600" text-anchor="start">4. 应用 Gateway</text>
<text x="24" y="391" font-size="14" font-weight="400" text-anchor="start">认证、入口授权</text>
<rect x="10" y="432" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="457" font-size="15" font-weight="600" text-anchor="start">5. 应用 Gateway → BFF</text>
<text x="24" y="479" font-size="14" font-weight="400" text-anchor="start">内部 JWT + 路由</text>
<rect x="10" y="520" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="545" font-size="15" font-weight="600" text-anchor="start">6. BFF</text>
<text x="24" y="567" font-size="14" font-weight="400" text-anchor="start">验签、操作授权</text>
<rect x="10" y="608" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="633" font-size="15" font-weight="600" text-anchor="start">7. BFF → IAM / 平台</text>
<text x="24" y="655" font-size="14" font-weight="400" text-anchor="start">按需获取平台菜单与用户</text>
<rect x="10" y="696" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="721" font-size="15" font-weight="600" text-anchor="start">8. BFF → 业务 Service</text>
<text x="24" y="743" font-size="14" font-weight="400" text-anchor="start">Feign 调用，传递 JWT</text>
<rect x="10" y="784" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="809" font-size="15" font-weight="600" text-anchor="start">9. 业务 Service</text>
<text x="24" y="831" font-size="14" font-weight="400" text-anchor="start">独立验签、业务授权</text>
<rect x="10" y="872" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="897" font-size="15" font-weight="600" text-anchor="start">10. 业务 Service → 自有数据</text>
<text x="24" y="919" font-size="14" font-weight="400" text-anchor="start">限定租户与数据范围</text>
<rect x="10" y="960" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="985" font-size="15" font-weight="600" text-anchor="start">11. 自有数据 → 调用方</text>
<text x="24" y="1007" font-size="14" font-weight="400" text-anchor="start">按契约逐层返回结果</text>
<text x="24" y="1076" font-size="14" font-weight="400" text-anchor="start">AK/SK、API Key 分别走应用认证路径；不自</text>
<text x="24" y="1097" font-size="14" font-weight="400" text-anchor="start">动获得用户角色。</text>
</g></svg>