<svg xmlns="http://www.w3.org/2000/svg" width="900" height="852" viewBox="0 0 900 852" role="img" aria-labelledby="title desc"><title id="title">可靠消息：本地事务与失败补偿</title><desc id="desc">图示以有事务场景为主；没有事务同步时会直接发送。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="900" height="852" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="22" y="32" font-size="19" font-weight="600" text-anchor="start">可靠消息：本地事务与失败补偿</text>
<text x="22" y="61" font-size="14" font-weight="400" text-anchor="start">按编号阅读；虚线箭头表示返回，浅色框表示条件或执行阶段。</text>
<path d="M123.0 124V787" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="17.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="123.0" y="110" font-size="14" font-weight="600" text-anchor="middle">业务 / Sender</text>
<path d="M341.0 124V787" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="235.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="341.0" y="110" font-size="14" font-weight="600" text-anchor="middle">本地数据库</text>
<path d="M559.0 124V787" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="453.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="559.0" y="110" font-size="14" font-weight="600" text-anchor="middle">发送 / 补偿</text>
<path d="M777.0 124V787" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="671.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="777.0" y="110" font-size="14" font-weight="600" text-anchor="middle">RocketMQ / 消费端</text>
<path d="M123.0 183H341.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="232.0" y="150" font-size="14" font-weight="400" text-anchor="middle">1. 同一本地事务写业务与消息</text>
<rect x="28" y="208" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="229" font-size="14" font-weight="400" text-anchor="start">2. 本地事务失败：一起回滚；提交成功：触发后续发送</text>
<path d="M123.0 323H559.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="341.0" y="290" font-size="14" font-weight="400" text-anchor="middle">3. 提交后执行发送任务</text>
<path d="M559.0 393H777.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="668.0" y="360" font-size="14" font-weight="400" text-anchor="middle">4. 发送消息</text>
<path d="M559.0 463H341.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="450.0" y="430" font-size="14" font-weight="400" text-anchor="middle">5. 记录发送结果</text>
<rect x="28" y="488" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="509" font-size="14" font-weight="400" text-anchor="start">6. 未成功记录由实际调度的补偿任务扫描；补偿任务需应用自行安排</text>
<path d="M559.0 603H341.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="450.0" y="570" font-size="14" font-weight="400" text-anchor="middle">7. 加载未成功消息</text>
<path d="M559.0 673H777.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="668.0" y="640" font-size="14" font-weight="400" text-anchor="middle">8. 再次发送；可能重复</text>
<rect x="675.0" y="694" width="204.0" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="684.0" y="712" font-size="14" font-weight="400" text-anchor="start">9. 按业务键幂等消费</text>
<text x="22" y="820" font-size="14" font-weight="400" text-anchor="start">图示以有事务场景为主；没有事务同步时会直接发送。</text>
</g></svg>