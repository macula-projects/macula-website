<svg xmlns="http://www.w3.org/2000/svg" width="900" height="782" viewBox="0 0 900 782" role="img" aria-labelledby="title desc"><title id="title">配置：启动加载与运行变更</title><desc id="desc">本图表达加载路径，不将所有属性源简化为一条固定优先级。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="900" height="782" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="22" y="32" font-size="19" font-weight="600" text-anchor="start">配置：启动加载与运行变更</text>
<text x="22" y="61" font-size="14" font-weight="400" text-anchor="start">按编号阅读；虚线箭头表示返回，浅色框表示条件或执行阶段。</text>
<path d="M123.0 124V717" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="17.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="123.0" y="110" font-size="14" font-weight="600" text-anchor="middle">部署环境</text>
<path d="M341.0 124V717" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="235.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="341.0" y="110" font-size="14" font-weight="600" text-anchor="middle">仓库 YAML</text>
<path d="M559.0 124V717" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="453.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="559.0" y="110" font-size="14" font-weight="600" text-anchor="middle">Nacos</text>
<path d="M777.0 124V717" stroke="#d8e3ef" stroke-dasharray="4 5"/>
<rect x="671.0" y="86" width="208.0" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="777.0" y="110" font-size="14" font-weight="600" text-anchor="middle">应用 Bean</text>
<path d="M123.0 183H341.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="232.0" y="150" font-size="14" font-weight="400" text-anchor="middle">1. 指定 profile、入口与凭据</text>
<rect x="239.0" y="204" width="204.0" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="248.0" y="222" font-size="14" font-weight="400" text-anchor="start">2. 选择激活文档和 import</text>
<path d="M341.0 323H559.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="290" font-size="14" font-weight="400" text-anchor="middle">3. 显式导入公共与环境 Data</text>
<text x="450.0" y="311" font-size="14" font-weight="400" text-anchor="middle">ID</text>
<path d="M559.0 393H341.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="450.0" y="360" font-size="14" font-weight="400" text-anchor="middle">4. 同一导入列表后项优先</text>
<path d="M341.0 463H777.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="559.0" y="430" font-size="14" font-weight="400" text-anchor="middle">5. 合并属性源，绑定并校验</text>
<rect x="28" y="488" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="509" font-size="14" font-weight="400" text-anchor="start">6. 最终值还受命令行、系统属性等影响；按实际 PropertySource 排查</text>
<path d="M559.0 603H777.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="668.0" y="570" font-size="14" font-weight="400" text-anchor="middle">7. 发布配置变更通知</text>
<rect x="28" y="628" width="844" height="52" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="42" y="649" font-size="14" font-weight="400" text-anchor="start">8. 支持刷新且验证通过的参数：确认行为变化；启动或重建类配置：受控重启</text>
<text x="22" y="750" font-size="14" font-weight="400" text-anchor="start">本图表达加载路径，不将所有属性源简化为一条固定优先级。</text>
</g></svg>