<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1066" viewBox="0 0 340 1066" role="img" aria-labelledby="title desc"><title id="title">网关：入口校验到响应保护（纵向阅读）</title><desc id="desc">这是职责时序；过滤器排序以本页全景图及源码为准。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="340" height="1066" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
<text x="16" y="29" font-size="18" font-weight="600" text-anchor="start">网关：入口校验到响应保护</text>
<text x="16" y="58" font-size="14" font-weight="400" text-anchor="start">沿编号阅读各参与方与执行步骤。</text>
<rect x="10" y="80" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="105" font-size="15" font-weight="600" text-anchor="start">1. 调用方 → 外层 WebFilter</text>
<text x="24" y="127" font-size="14" font-weight="400" text-anchor="start">提交业务请求与外部凭据</text>
<rect x="10" y="168" width="320" height="92" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="24" y="193" font-size="15" font-weight="600" text-anchor="start">2. 条件 / 阶段</text>
<text x="24" y="215" font-size="14" font-weight="400" text-anchor="start">本地端点可直接返回；业务路由继续外层安全</text>
<text x="24" y="236" font-size="14" font-weight="400" text-anchor="start">校验</text>
<rect x="10" y="277" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="302" font-size="15" font-weight="600" text-anchor="start">3. 外层 WebFilter</text>
<text x="24" y="324" font-size="14" font-weight="400" text-anchor="start">认证与入口权限</text>
<rect x="10" y="365" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="390" font-size="15" font-weight="600" text-anchor="start">4. 外层 WebFilter → 网关路由过滤链</text>
<text x="24" y="412" font-size="14" font-weight="400" text-anchor="start">匹配路由，进入过滤链</text>
<rect x="10" y="453" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="478" font-size="15" font-weight="600" text-anchor="start">5. 网关路由过滤链</text>
<text x="24" y="500" font-size="14" font-weight="400" text-anchor="start">按需校验签名、解密</text>
<rect x="10" y="541" width="320" height="92" rx="7" fill="#f1f8f4" stroke="#d5e2ef"/>
<text x="24" y="566" font-size="15" font-weight="600" text-anchor="start">6. 条件 / 阶段</text>
<text x="24" y="588" font-size="14" font-weight="400" text-anchor="start">HMAC 在 Kong 过滤器实际验签；失败即拒绝</text>
<text x="24" y="609" font-size="14" font-weight="400" text-anchor="start">，不进入下游</text>
<rect x="10" y="650" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="675" font-size="15" font-weight="600" text-anchor="start">7. 网关路由过滤链</text>
<text x="24" y="697" font-size="14" font-weight="400" text-anchor="start">可信身份转换为 JWT</text>
<rect x="10" y="738" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="763" font-size="15" font-weight="600" text-anchor="start">8. 网关路由过滤链 → 下游服务</text>
<text x="24" y="785" font-size="14" font-weight="400" text-anchor="start">转发请求</text>
<rect x="10" y="826" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="851" font-size="15" font-weight="600" text-anchor="start">9. 下游服务 → 网关路由过滤链</text>
<text x="24" y="873" font-size="14" font-weight="400" text-anchor="start">返回业务结果</text>
<rect x="10" y="914" width="320" height="71" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="24" y="939" font-size="15" font-weight="600" text-anchor="start">10. 网关路由过滤链 → 调用方</text>
<text x="24" y="961" font-size="14" font-weight="400" text-anchor="start">按需加密响应，返回调用方</text>
<text x="24" y="1030" font-size="14" font-weight="400" text-anchor="start">这是职责时序；过滤器排序以本页全景图及源</text>
<text x="24" y="1051" font-size="14" font-weight="400" text-anchor="start">码为准。</text>
</g></svg>