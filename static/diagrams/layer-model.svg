<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">服务内：查询与写入对象传递</title><desc id="desc">查询 Query 由 Controller 传到 Service、Mapper；数据库结果在服务转换成 VO。写入 Form 或 DTO 在 Service 转换成 Entity 或 BO，经 Mapper 持久化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="100%" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#172839"><text x="24" y="32" font-weight="600">服务内：查询与写入对象传递</text><rect x="24" y="65" width="120" height="55" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="84.0" y="90" text-anchor="middle">调用方 / View</text><rect x="184" y="65" width="125" height="55" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="246.5" y="90" text-anchor="middle">Controller</text><rect x="349" y="65" width="125" height="55" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="411.5" y="90" text-anchor="middle">Service</text><rect x="514" y="65" width="110" height="55" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="569.0" y="90" text-anchor="middle">Mapper</text><rect x="664" y="65" width="72" height="55" rx="8" fill="#edf5fe" stroke="#b6cde5"/><text x="700.0" y="90" text-anchor="middle">DB</text><path d="M144 153H309" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="226.5" y="144.0" text-anchor="middle">Query →</text><path d="M309 153H474" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="391.5" y="144.0" text-anchor="middle">Query →</text><path d="M474 153H624" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="549.0" y="144.0" text-anchor="middle">Query →</text><path d="M624 153H736" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="680.0" y="144.0" text-anchor="middle">SQL →</text><path d="M664 203H474" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="569.0" y="194.0" text-anchor="middle">Entity / BO</text><path d="M349 203H24" stroke="#c47612" stroke-width="2" marker-end="url(#arrow)"/><text x="186.5" y="194.0" text-anchor="middle">转换 VO → 返回调用方</text><path d="M24 268H349" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="186.5" y="259.0" text-anchor="middle">Form / DTO → 校验 → 业务</text><path d="M349 268H624" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="486.5" y="259.0" text-anchor="middle">转换 Entity / BO →</text><path d="M624 268H736" stroke="#249272" stroke-width="2" marker-end="url(#arrow)"/><text x="680.0" y="259.0" text-anchor="middle">SQL →</text><text x="24" y="324">橙色：查询；绿色：写入。Service 负责业务、事务、授权与模型转换。</text><text x="24" y="355">Query 语义一致可透传；Entity 留在持久化边界，VO 按接口契约返回。</text><text x="24" y="386">Mapper 不承担展示模型转换；Converter 封装映射规则。</text></g></svg>