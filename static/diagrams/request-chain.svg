<text x="159.33333333333334" y="150" font-size="14" font-weight="400" text-anchor="middle">1. 外部 Token / 应</text>
<text x="159.33333333333334" y="171" font-size="14" font-weight="400" text-anchor="middle">用凭据</text>
<path d="M232.0 253H377.33333333333337" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="304.6666666666667" y="220" font-size="14" font-weight="400" text-anchor="middle">2. Token 内省；应</text>
<text x="304.6666666666667" y="241" font-size="14" font-weight="400" text-anchor="middle">用凭据读取平台缓存</text>
<path d="M377.33333333333337 323H232.0" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
