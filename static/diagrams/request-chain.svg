<svg xmlns="http://www.w3.org/2000/svg" width="900" height="992" viewBox="0 0 900 992" role="img" aria-labelledby="title desc"><title id="title">一次请求：职责与身份流转</title><desc id="desc">AK/SK、API Key 分别走应用认证路径；不自动获得用户角色。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#3174b9"/></marker></defs><rect width="900" height="992" rx="10" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#33475b">
