<text x="522.6666666666667" y="110" font-size="14" font-weight="600" text-anchor="middle">BFF</text>
<rect x="595.3333333333334" y="82" width="140.33333333333334" height="842" rx="7" fill="#f8fafc" stroke="#d5e2ef"/>
<rect x="598.3333333333334" y="86" width="135.33333333333334" height="38" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="668.0" y="110" font-size="14" font-weight="600" text-anchor="middle">业务 Service</text>
