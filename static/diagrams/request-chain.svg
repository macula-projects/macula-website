<text x="377.33333333333337" y="430" font-size="14" font-weight="400" text-anchor="middle">5. 内部 JWT + 路由</text>
<rect x="457.00000000000006" y="484" width="131.33333333333334" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="466.00000000000006" y="502" font-size="14" font-weight="400" text-anchor="start">6. 验签、操作授</text>
<text x="466.00000000000006" y="523" font-size="14" font-weight="400" text-anchor="start">权</text>
<path d="M522.6666666666667 603H377.33333333333337" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="450.00000000000006" y="570" font-size="14" font-weight="400" text-anchor="middle">7. 按需获取平台菜</text>
<text x="450.00000000000006" y="591" font-size="14" font-weight="400" text-anchor="middle">单与用户</text>
<path d="M522.6666666666667 673H668.0" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="595.3333333333334" y="640" font-size="14" font-weight="400" text-anchor="middle">8. Feign 调用，传</text>
<text x="595.3333333333334" y="661" font-size="14" font-weight="400" text-anchor="middle">递 JWT</text>
<rect x="602.3333333333334" y="694" width="131.33333333333334" height="49" rx="7" fill="#f2f7fd" stroke="#d5e2ef"/>
<text x="611.3333333333334" y="712" font-size="14" font-weight="400" text-anchor="start">9. 独立验签、业</text>
<text x="611.3333333333334" y="733" font-size="14" font-weight="400" text-anchor="start">务授权</text>
<path d="M668.0 813H813.3333333333334" stroke="#3174b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="740.6666666666667" y="780" font-size="14" font-weight="400" text-anchor="middle">10. 限定租户与数据</text>
<text x="740.6666666666667" y="801" font-size="14" font-weight="400" text-anchor="middle">范围</text>
<path d="M813.3333333333334 883H86.66666666666667" stroke="#3174b9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="450.0" y="850" font-size="14" font-weight="400" text-anchor="middle">11. 按契约逐层返回结果</text>
<text x="22" y="960" font-size="14" font-weight="400" text-anchor="start">AK/SK、API Key 分别走应用认证路径；不自动获得用户角色。</text>
